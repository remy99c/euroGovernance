name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, 'codex/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'false'
      NEXT_PUBLIC_ENABLE_DEV_PERSONAS: 'false'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: eurogovernance-ci
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: eurogovernance-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: eurogovernance-ci.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ci-build-placeholder'
      NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION: europe-west3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run type checks, builds, and full Firebase emulator tests
        run: npm run emulators:exec
