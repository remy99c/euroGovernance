name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, 'codex/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'false'
      NEXT_PUBLIC_ENABLE_DEV_PERSONAS: 'false'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: eurogovernance-ci
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSy1234567890abcdefghijklmnopqrstuvw
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: eurogovernance-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: eurogovernance-ci.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:123456789012:web:cafe1234567890abcd'
      NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY: 6LcI1234567890abcdefghijklmnopqrstuvwx
      NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION: europe-west3
      EXPECTED_FIREBASE_PROJECT_ID: eurogovernance-ci
      EXPECTED_FIREBASE_API_KEY: AIzaSy1234567890abcdefghijklmnopqrstuvw
      EXPECTED_FIREBASE_AUTH_DOMAIN: eurogovernance-ci.firebaseapp.com
      EXPECTED_FIREBASE_STORAGE_BUCKET: eurogovernance-ci.appspot.com
      EXPECTED_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
      EXPECTED_FIREBASE_APP_ID: '1:123456789012:web:cafe1234567890abcd'
      EXPECTED_FIREBASE_APP_CHECK_SITE_KEY: 6LcI1234567890abcdefghijklmnopqrstuvwx
      EXPECTED_FIREBASE_FUNCTIONS_REGION: europe-west3
      ASSESSMENT_PORTAL_ORIGIN: https://portal-ci.invalid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java (for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install the isolated Functions deployment graph
        run: npm --prefix functions ci --workspaces=false

      - name: Validate both installed dependency trees
        run: npm ls --all && npm --prefix functions ls --all --workspaces=false

      - name: Run type checks, builds, and full Firebase emulator tests
        run: npm run emulators:exec
